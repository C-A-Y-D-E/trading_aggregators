[package]
name = "trading_aggregator"
version = "0.1.1"
edition = "2024"
# never publish to crates.io — this stays private (consumed via private git / path dep)
publish = false

[lib]
test = false
doctest = false

[dependencies]
alloy-primitives = { version = "=1.5.7", default-features = false, features = ["std", "serde"] }
# EVM EIP-1559 encoding, signing hash and signer recovery; 2.0.x is the line on alloy-primitives 1.5
alloy-consensus = { version = "2.0.4", default-features = false, features = ["std", "k256"] }
anyhow = "1.0.102"
async-trait = "0.1.89"
# Jupiter aggregator + submitters (bloXroute): http client + json + base64 + tx wire bytes
base64 = "0.22"
bincode = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# borsh + derive: account layouts are read into named-field structs (not byte offsets)
borsh = { version = "1.6.1", features = ["derive"] }
# granular solana crates pinned to solana-client 4.2's line (no solana-sdk meta-crate,
# which is ahead of the client and caused a VersionedTransaction type skew).
# solana-message 4.x is the first line with v1 transactions. solana-client 4.3 needs rustc 1.97.
solana-client = "~4.2.2"
solana-pubkey = { version = "4.1.0", features = ["borsh"] }
solana-instruction = "3.3.0"
solana-message = "4.2.3"
solana-transaction = { version = "4.1.4", features = ["serde", "wincode"] }
# Solana wire bytes: bincode writes V1 transactions in the wrong layout (signatures first)
wincode = "0.5.5"
solana-signature = "3.3.0"
solana-commitment-config = "3.1.0"
solana-address-lookup-table-interface = { version = "3.0.1", features = ["bincode", "bytemuck"] }
# sha256 for deriving Anchor instruction discriminators from method names
sha2 = "0.10"
spl-token = "9.0.0"
# typed library error (TradeError) so the API-layer consumer gets legible failures
thiserror = "2"
tokio = "1.52.3"
# EVM node JSON-RPC: nonce, gas, fees, receipts, raw submission (rustls, like reqwest above)
# Cargo.lock must keep alloy-sol-macro, -expander and -input at 1.5.7 to match the pinned
# alloy-primitives; 1.7.x emits code alloy-provider can't compile against alloy-sol-types 1.5.
# After `cargo update`, re-pin each: cargo update -p alloy-sol-macro --precise 1.5.7
# (then the same for alloy-sol-macro-expander and alloy-sol-macro-input).
alloy-provider = { version = "2.0.4", default-features = false, features = ["reqwest", "reqwest-rustls-tls"] }
# Typed Uniswap and CswapRouter calldata (sol! interfaces); pinned with alloy-primitives.
alloy-sol-types = "=1.5.7"

[dev-dependencies]
# Used by the create_shared_alt example.
solana-keypair = "3.0.0"
solana-signer = "3.0.0"
solana-slot-hashes = { version = "3.0.1", features = ["serde"] }
